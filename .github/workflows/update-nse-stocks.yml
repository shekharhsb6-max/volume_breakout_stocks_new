
name: Update NSE Stocks to Google Sheet

on:
  schedule:
    # All times are UTC; India is UTC + 5:30.
    # Attempt 1: 8:15 PM IST
    - cron: "45 14 * * 1-5"

    # Attempt 2: 8:45 PM IST
    - cron: "15 15 * * 1-5"

    # Attempt 3: 9:15 PM IST
    - cron: "45 15 * * 1-5"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-nse-stocks-sheet
  cancel-in-progress: false

jobs:
  update-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install gspread oauth2client pandas requests

      - name: Check Google Credentials
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          raw = os.environ.get("GCP_CREDENTIALS", "")
          if not raw:
              sys.exit("ERROR: GCP_CREDENTIALS secret is empty.")

          try:
              credentials = json.loads(raw)
          except json.JSONDecodeError:
              sys.exit("ERROR: GCP_CREDENTIALS is not valid JSON.")

          if not credentials.get("client_email") or not credentials.get("private_key"):
              sys.exit("ERROR: Service-account credentials are incomplete.")

          print("Google service-account credentials are available.")
          PY

      - name: Run Update Script
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python update_sheet.py
